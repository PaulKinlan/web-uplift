name: cdp-copy-sync

# The repo vendors the installed .web-uplift/ tree (evidence CLIs, aggregate,
# runner, knowledge, schema and skill - the paths `web-uplift install` copies
# into a consumer project). Nothing regenerates it automatically, so this job
# fails when any vendored copy stops being byte-identical to its source.
#
# Deliberately unfiltered and dependency-free: tests/cdp-copy-sync.mjs is pure
# Node builtins over file pairs, so it needs no npm install, no Chrome and no
# served fixture, and it runs in about a second on every push and PR.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cdp-copy-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # checkout leaves us at the repo root; the script also resolves its own
      # paths from its location, so this is stable regardless of cwd.
      - name: Vendored copies match their sources
        run: node tests/cdp-copy-sync.mjs
