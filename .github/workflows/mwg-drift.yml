name: mwg-drift

# Recurring drift check for Modern Web Guidance (MWG).
# Runs tests/mwg-drift-check.mjs every 6 hours to detect upstream package releases,
# compare them against knowledge/mwg-state.json, and trigger reanalysis when needed.
# Also runs a freshness heartbeat job asserting that the check ran within 30 hours.
#
# Known limitation: GitHub Actions disables scheduled workflows after approximately
# 60 days of repository inactivity. Therefore, the authoritative total-absence
# guard is the VM-level timer (fleet provisioning, escalated via the hub).

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mwg-drift-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run drift check
        id: run_check
        run: |
          set +e
          output=$(node tests/mwg-drift-check.mjs --write --json 2>&1)
          code=$?
          echo "$output"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "check_output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Persist check state
        # 4 (anchor-broken) persists too (web-uplift-6f8x): the check wrote lastAnchorCheck and
        # lastCheckResult, so leaving the state behind would freeze lastCheckAt and then let the
        # freshness job age a KNOWN condition into a stale-heartbeat alert. A broken anchor is work
        # to do, tracked by its own issue - not a reason to stop recording that we looked.
        if: steps.run_check.outputs.exit_code == '0' || steps.run_check.outputs.exit_code == '2' || steps.run_check.outputs.exit_code == '4'
        run: |
          if ! git diff --quiet knowledge/mwg-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add knowledge/mwg-state.json
            git commit -m "chore(mwg-drift): record scheduled upstream check [skip ci]"
            git push
          fi

      - name: File reanalysis issue
        # always(): a failed state push must not suppress the delta alert.
        if: always() && steps.run_check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTPUT: ${{ steps.run_check.outputs.check_output }}
        run: |
          OPEN_COUNT=$(gh issue list --state open --search "in:title \"MWG upstream moved: reanalysis needed\"" --json title --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            cat << 'EOF' > /tmp/issue-body.md
          A version delta was detected between the analysed Modern Web Guidance catalog and upstream npm.

          Check output:
          ```
          EOF
            printf '%s\n' "$CHECK_OUTPUT" >> /tmp/issue-body.md
            cat << 'EOF' >> /tmp/issue-body.md
          ```

          Full reanalysis (catalog regeneration and principles coverage re-verification per knowledge/mwg-catalog.md and knowledge/guidance.md) must run and knowledge/mwg-state.json analysedVersion must be bumped.
          EOF
            gh issue create \
              --title "MWG upstream moved: reanalysis needed" \
              --body-file /tmp/issue-body.md
          fi

      - name: File check-failure issue
        # always(): a failed state push must not suppress the failure alert.
        if: always() && steps.run_check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTPUT: ${{ steps.run_check.outputs.check_output }}
        run: |
          OPEN_COUNT=$(gh issue list --state open --search "in:title \"MWG drift check is failing\"" --json title --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            cat << 'EOF' > /tmp/issue-body.md
          The Modern Web Guidance drift check itself could not run (unreachable/empty/unparseable upstream or invalid state).

          A silent 'no change' is exactly the failure mode this exists to catch.

          Check output:
          ```
          EOF
            printf '%s\n' "$CHECK_OUTPUT" >> /tmp/issue-body.md
            cat << 'EOF' >> /tmp/issue-body.md
          ```
          EOF
            gh issue create \
              --title "MWG drift check is failing" \
              --body-file /tmp/issue-body.md
          fi

      - name: File anchor-broken issue
        # always(): a failed state push must not suppress the anchor alert either.
        # The subject is derived by tests/mwg-drift-anchor-subject.mjs from the guard's OWN
        # ANCHOR-BROKEN wording, anchored and parsed field by field, so a fixture can drive it
        # (web-uplift-6f8x) and so no title can be invented from a message the guard did not print.
        if: always() && steps.run_check.outputs.exit_code == '4'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTPUT: ${{ steps.run_check.outputs.check_output }}
        run: |
          printf '%s\n' "$CHECK_OUTPUT" > /tmp/anchor-check-output.txt
          SUBJECT=$(node tests/mwg-drift-anchor-subject.mjs --output /tmp/anchor-check-output.txt --body-file /tmp/issue-body.md)
          TAG=$(printf '%s\n' "$SUBJECT" | sed -n 's/^TAG=//p' | head -1)
          TITLE=$(printf '%s\n' "$SUBJECT" | sed -n 's/^TITLE=//p' | head -1)
          if [ -z "$TITLE" ]; then
            echo "::error::the check exited 4 but tests/mwg-drift-anchor-subject.mjs found no ANCHOR-BROKEN subject in its output"
            exit 1
          fi
          echo "title=$TITLE" >> "$GITHUB_STEP_SUMMARY"
          # Dedupe per condition on the stable tag, the same tag the freshness job uses.
          OPEN_COUNT=$(gh issue list --state open --search "in:title \"${TAG}\"" --json title --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          else
            echo "An open anchor-broken issue already exists; not filing another."
          fi

      - name: Run status
        # 4 passes the job like 2 does: an anchor that no longer resolves is work to do (re-anchor),
        # surfaced by its own issue, not the guard failing to run. Exit 1 keeps the job red. Passing
        # on 4 also lets the freshness job run against the state this job just persisted.
        if: always()
        run: |
          if [ "${{ steps.run_check.outputs.exit_code }}" = "0" ] || [ "${{ steps.run_check.outputs.exit_code }}" = "2" ] || [ "${{ steps.run_check.outputs.exit_code }}" = "4" ]; then
            exit 0
          else
            exit 1
          fi

  freshness:
    # Runs after check so the drift check's state commit has landed; checks out
    # the default branch HEAD (not the scheduled SHA) so it sees that commit.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check freshness
        id: run_freshness
        run: |
          set +e
          output=$(node tests/mwg-drift-check.mjs --freshness-only --max-age 30h 2>&1)
          code=$?
          echo "$output"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "freshness_output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Classify the freshness failure and file one issue
        if: steps.run_freshness.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRESHNESS_OUTPUT: ${{ steps.run_freshness.outputs.freshness_output }}
        run: |
          # The freshness guard exits non-zero for SEVERAL different conditions, not just a stale
          # heartbeat: a stale heartbeat, a delta that nobody has acted on (where the age that matters
          # is the ANALYSIS's, so a fresh heartbeat cannot rescue it), and an in-sync claim the state
          # cannot substantiate. The subject line is the part that survives into a notification, so it
          # has to name the condition that actually fired - a woken reader told "heartbeat stale" when
          # the heartbeat is fresh learns to dismiss a real unactioned delta as noise (web-uplift-vc4h).
          #
          # Every value below is parsed out of the guard's OWN output. Nothing is invented: if the
          # guard did not print it, it is not in the title.
          OUT="$FRESHNESS_OUTPUT"

          # The failed condition is chosen by the guard's own wording, most specific first.
          #
          # AGE SHAPES (web-uplift-dsl2): formatDuration emits `${ms}ms` below a second and then
          # toFixed(1) for s/m/h/d, so a FRACTIONAL value is the NORMAL shape - '5.2d' and '35.5h' are what
          # a real alert carries. The regexes below therefore accept an optional one-decimal fraction and
          # the units ms|s|m|h|d. They deliberately do NOT accept 'w' or compound forms like '1h 30m':
          # formatDuration cannot emit them (it switches to the next unit rather than composing), so
          # accepting them would only make the pattern look more general than the data it reads. A unit
          # added to formatDuration means adding it here.
          # ANCHORED EXTRACTION (web-uplift-igdk). Every age below is read only from a line the guard emits
          # as a MEASURED age, matched end to end. The previous patterns began with '.*', so 'last check was
          # 35.5h ago' matched INSIDE an invalid lastCheckAt value the guard had just declared unusable - the
          # alert then reported a measurement it never made, about a field it knew was invalid. Anchoring is
          # what makes the extraction honest: if the output is not the guard's measured-age sentence there is
          # no age, and the subject says so instead of inventing one.
          #
          # An unusable lastCheckAt is classified FIRST and carries NO age: a number there would be fiction,
          # however plausible it looks.
          # ANCHOR FIRST (web-uplift-6f8x). The drift check exits 4 for a rule basis whose anchors no
          # longer resolve, and the freshness pass repeats that condition. This branch is checked before
          # every STALE branch, so an anchor problem can never be read out as a stale heartbeat or an
          # unactioned delta - the two conditions web-uplift-vc4h spent three rounds separating. The
          # subject comes from the same script the check job uses, on the same stable tag, so the two
          # jobs cannot open two issues for one condition.
          # Two anchored shapes, both the guard's own: the check pass lists a problem count, the
          # freshness pass repeats the recorded condition without one. Either way the condition is
          # anchor-broken; neither shape is a bare mention of the phrase.
          if printf '%s\n' "$OUT" | grep -qE '^ANCHOR-BROKEN: [1-9][0-9]* rule-basis anchor problem\(s\) against upstream [^ ]+$|^ANCHOR-BROKEN: the last check recorded that the rule basis no longer verifies against upstream [^ ;]+;'; then
            if SUBJECT=$(printf '%s\n' "$OUT" | node tests/mwg-drift-anchor-subject.mjs 2>/dev/null); then
              CONDITION=$(printf '%s\n' "$SUBJECT" | sed -n 's/^CONDITION=//p' | head -1)
              TAG=$(printf '%s\n' "$SUBJECT" | sed -n 's/^TAG=//p' | head -1)
              TITLE=$(printf '%s\n' "$SUBJECT" | sed -n 's/^TITLE=//p' | head -1)
            else
              # Exit 4 without the guard's own wording is a classifier bug, not an unrecognised failure:
              # name the condition and do not borrow the heartbeat title for it.
              CONDITION=anchor-broken
              TAG="MWG rule-basis anchor broken"
              TITLE="$TAG - freshness guard reported anchor-broken without a parseable violation"
            fi
          elif printf '%s\n' "$OUT" | grep -qF 'lastCheckAt in state file is not a valid timestamp'; then
            CONDITION=heartbeat-invalid
            TAG="MWG drift check heartbeat invalid"
            TITLE="$TAG - lastCheckAt is not a timestamp, so no age can be measured"
          elif printf '%s\n' "$OUT" | grep -qE '^STALE: lastCheckAt is .* in the FUTURE'; then
            CONDITION=heartbeat-invalid
            TAG="MWG drift check heartbeat invalid"
            TITLE="$TAG - lastCheckAt is in the future, so no age can be measured"
          elif printf '%s\n' "$OUT" | grep -qF 'unsubstantiated in-sync claim'; then
            CONDITION=unsubstantiated
            TAG="MWG drift: in-sync claim cannot be substantiated"
            TITLE="$TAG"
          elif printf '%s\n' "$OUT" | grep -qE '^STALE: .*, and that analysis is ([0-9]+(\.[0-9])?(ms|s|m|h|d)) old, exceeding max-age threshold'; then
            CONDITION=unactioned-delta
            TAG="MWG drift: unactioned delta"
            AGE=$(printf '%s\n' "$OUT" | sed -nE 's/^STALE: .*, and that analysis is ([0-9]+(\.[0-9])?(ms|s|m|h|d)) old, exceeding max-age threshold.*$/\1/p' | head -1)
            if [ -n "$AGE" ]; then
              TITLE="$TAG - analysis ${AGE} old, upstream has moved on"
            else
              TITLE="$TAG - the latest analysis is older than max-age"
            fi
          elif printf '%s\n' "$OUT" | grep -qE '^STALE: last check was ([0-9]+(\.[0-9])?(ms|s|m|h|d)) ago, exceeding max-age threshold'; then
            CONDITION=heartbeat-stale
            TAG="MWG drift check heartbeat stale"
            AGE=$(printf '%s\n' "$OUT" | sed -nE 's/^STALE: last check was ([0-9]+(\.[0-9])?(ms|s|m|h|d)) ago, exceeding max-age threshold.*$/\1/p' | head -1)
            if [ -n "$AGE" ]; then
              TITLE="$TAG - last check ${AGE} ago"
            else
              TITLE="$TAG - no usable last-check timestamp"
            fi
          elif printf '%s\n' "$OUT" | grep -qF 'no recorded check timestamp'; then
            CONDITION=heartbeat-missing
            TAG="MWG drift check heartbeat stale"
            TITLE="$TAG - no usable last-check timestamp"
          else
            # Anything else is the guard failing to run at all (exit 1) or a shape this classifier does
            # not know. Say that rather than borrowing the heartbeat title for it.
            CONDITION=check-failed
            TAG="MWG drift check could not complete"
            TITLE="$TAG - freshness guard reported an unrecognised failure"
          fi

          echo "condition=$CONDITION" >> "$GITHUB_STEP_SUMMARY"
          echo "title=$TITLE" >> "$GITHUB_STEP_SUMMARY"

          # Dedupe is PER CONDITION, on the stable tag each branch sets. Searching one hard-coded title
          # suppressed the other condition entirely: an open "heartbeat stale" issue would swallow a real
          # unactioned delta, which is the failure this bead is about, one level down (web-uplift-vc4h).
          OPEN_COUNT=$(gh issue list --state open --search "in:title \"${TAG}\"" --json title --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            {
              echo "This is a **${CONDITION}** alert, not a heartbeat-stale alert unless it says so."
              echo
              echo "Condition: ${CONDITION}"
              echo
              echo "Guard output:"
              echo '```'
              printf '%s\n' "$OUT"
              echo '```'
            } > /tmp/issue-body.md
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          else
            echo "An open MWG drift issue already exists; not filing another."
          fi

      - name: Freshness status
        if: steps.run_freshness.outputs.exit_code != '0'
        run: exit 1
